version: "3.8"

services:
  campusgigs-db:
    image: postgres:16-alpine
    container_name: campusgigs-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: campusgigs
      POSTGRES_USER: campusgigs
      POSTGRES_PASSWORD: campusgigs123
    ports:
      - "5432:5432"
    volumes:
      - campusgigs-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusgigs -d campusgigs"]
      interval: 5s
      timeout: 5s
      retries: 5

  campusgigs-api:
    build: .
    container_name: campusgigs-api
    restart: unless-stopped
    depends_on:
      campusgigs-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://campusgigs-db:5432/campusgigs
      SPRING_DATASOURCE_USERNAME: campusgigs
      SPRING_DATASOURCE_PASSWORD: campusgigs123
    ports:
      - "8080:8080"

volumes:
  campusgigs-data:
