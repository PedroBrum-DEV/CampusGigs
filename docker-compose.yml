version: "3.8"

services:
  campusgigs-db:
    image: postgres:16-alpine
    container_name: campusgigs-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: campusgigs
      POSTGRES_USER: campusgigs
      POSTGRES_PASSWORD: campusgigs123
    ports:
      - "5432:5432"
    volumes:
      - campusgigs-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusgigs -d campusgigs"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  campusgigs-data:
