<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusGigs — Console de Testes</title>
    <style>
        :root {
            --bg: #0F1115;
            --panel: #171A21;
            --panel-2: #1E222B;
            --border: #2A2F3A;
            --text: #E7E9EE;
            --muted: #8B92A5;
            --accent: #5B8DEF;
            --accent-dim: #375AA8;
            --success: #3DDC97;
            --danger: #FF6B6B;
            --warning: #FFB454;
            --mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
            --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            font-size: 14px;
            height: 100vh;
            overflow: hidden;
        }

        /* ---------- Top bar ---------- */
        .topbar {
            height: 56px;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 0 20px;
            border-bottom: 1px solid var(--border);
            background: var(--panel);
        }

        .brand {
            font-weight: 700;
            font-size: 15px;
            letter-spacing: -0.01em;
            white-space: nowrap;
        }
        .brand span { color: var(--accent); }

        .baseurl-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            max-width: 480px;
        }
        .baseurl-wrap label { color: var(--muted); font-size: 12px; white-space: nowrap; }
        .baseurl-wrap input {
            flex: 1;
            background: var(--panel-2);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: var(--mono);
            font-size: 12.5px;
            padding: 7px 10px;
            border-radius: 6px;
        }
        .baseurl-wrap input:focus { outline: none; border-color: var(--accent); }

        .session {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12.5px;
        }
        .session .who { color: var(--muted); }
        .session .who b { color: var(--text); }
        .badge {
            padding: 3px 9px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.02em;
        }
        .badge.role-ADMIN { background: rgba(255,180,84,0.15); color: var(--warning); }
        .badge.role-STUDENT { background: rgba(91,141,239,0.15); color: var(--accent); }
        .badge.none { background: rgba(139,146,165,0.15); color: var(--muted); }
        .btn-logout {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 12px;
            cursor: pointer;
        }
        .btn-logout:hover { border-color: var(--danger); color: var(--danger); }

        /* ---------- Layout ---------- */
        .layout {
            display: flex;
            height: calc(100vh - 56px);
        }

        .rail {
            width: 250px;
            border-right: 1px solid var(--border);
            background: var(--panel);
            overflow-y: auto;
            padding: 10px 0;
            flex-shrink: 0;
        }

        .group-title {
            padding: 14px 16px 6px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.06em;
            color: var(--muted);
        }

        .req-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            cursor: pointer;
            border-left: 2px solid transparent;
        }
        .req-item:hover { background: var(--panel-2); }
        .req-item.active { background: var(--panel-2); border-left-color: var(--accent); }

        .method {
            font-family: var(--mono);
            font-size: 10.5px;
            font-weight: 700;
            width: 44px;
            flex-shrink: 0;
            text-align: center;
            padding: 2px 0;
            border-radius: 4px;
        }
        .method.GET { color: #7BD389; background: rgba(123,211,137,0.12); }
        .method.POST { color: #5B8DEF; background: rgba(91,141,239,0.12); }
        .method.PUT { color: #FFB454; background: rgba(255,180,84,0.12); }
        .method.PATCH { color: #C792EA; background: rgba(199,146,234,0.12); }
        .method.DELETE { color: #FF6B6B; background: rgba(255,107,107,0.12); }

        .req-label { font-size: 12.5px; color: var(--text); }
        .req-lock { margin-left: auto; font-size: 11px; color: var(--muted); }

        /* ---------- Main panel ---------- */
        .main {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px 60px;
        }

        .req-header { margin-bottom: 18px; }
        .req-title { font-size: 17px; font-weight: 700; margin: 0 0 4px; }
        .req-desc { color: var(--muted); font-size: 13px; }
        .req-path {
            font-family: var(--mono);
            font-size: 12.5px;
            color: var(--accent);
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-grid {
            display: grid;
            gap: 12px;
            max-width: 560px;
            margin-top: 18px;
        }
        .field label {
            display: block;
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 5px;
        }
        .field input, .field textarea, .field select {
            width: 100%;
            background: var(--panel-2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 9px 11px;
            border-radius: 6px;
            font-size: 13px;
            font-family: var(--sans);
        }
        .field textarea { font-family: var(--mono); min-height: 70px; resize: vertical; }
        .field input:focus, .field textarea:focus, .field select:focus {
            outline: none; border-color: var(--accent);
        }

        .actions { margin-top: 20px; display: flex; align-items: center; gap: 12px; }
        .btn-send {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 10px 22px;
            border-radius: 7px;
            font-weight: 600;
            font-size: 13.5px;
            cursor: pointer;
        }
        .btn-send:hover { background: var(--accent-dim); }
        .btn-send:disabled { opacity: 0.5; cursor: default; }

        .auth-note { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
        .auth-note.ok { color: var(--success); }
        .auth-note.missing { color: var(--warning); }

        /* ---------- Response ---------- */
        .response {
            margin-top: 28px;
            max-width: 720px;
        }
        .response-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .response-title { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
        .status-pill {
            font-family: var(--mono);
            font-size: 12px;
            font-weight: 700;
            padding: 2px 9px;
            border-radius: 5px;
        }
        .status-2xx { background: rgba(61,220,151,0.15); color: var(--success); }
        .status-4xx { background: rgba(255,107,107,0.15); color: var(--danger); }
        .status-5xx { background: rgba(255,107,107,0.15); color: var(--danger); }
        .status-err { background: rgba(255,180,84,0.15); color: var(--warning); }

        pre.body {
            background: #0B0D11;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px 16px;
            font-family: var(--mono);
            font-size: 12.5px;
            line-height: 1.55;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
            color: #D7DBE5;
            max-height: 360px;
            overflow-y: auto;
        }

        .empty-state {
            color: var(--muted);
            font-size: 13px;
            margin-top: 60px;
        }

        ::-webkit-scrollbar { width: 9px; height: 9px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
    </style>
</head>
<body>

<div class="topbar">
    <div class="brand">Campus<span>Gigs</span> · Console</div>
    <div class="baseurl-wrap">
        <label for="baseUrl">API</label>
        <input id="baseUrl" type="text" value="http://localhost:8081" />
    </div>
    <div class="session">
        <span class="who" id="whoLabel">não logado</span>
        <span class="badge none" id="roleBadge">—</span>
        <button class="btn-logout" id="logoutBtn">sair</button>
    </div>
</div>

<div class="layout">
    <div class="rail" id="rail"></div>
    <div class="main" id="main">
        <div class="empty-state">Selecione uma requisição na lista à esquerda.</div>
    </div>
</div>

<script>
    const state = { token: null, username: null, role: null };

    const groups = [
        {
            title: "Auth",
            items: [
                {
                    id: "register",
                    method: "POST",
                    path: "/auth/register",
                    label: "Registrar aluno",
                    desc: "Cria um novo usuário (sempre com papel STUDENT). O CEP é validado e enriquecido (cidade/UF) via ViaCEP.",
                    auth: "none",
                    fields: [
                        { name: "name", label: "Nome", type: "text", value: "Diego Teste" },
                        { name: "username", label: "Username", type: "text", value: "diego.teste" },
                        { name: "password", label: "Senha", type: "text", value: "senha123" },
                        { name: "cep", label: "CEP", type: "text", value: "01310930" }
                    ],
                    onSuccess: (data) => { if (data.token) applySession(data); }
                },
                {
                    id: "login",
                    method: "POST",
                    path: "/auth/login",
                    label: "Login",
                    desc: "Autentica e retorna o token JWT. O token fica salvo automaticamente pro resto do console.",
                    auth: "none",
                    fields: [
                        { name: "username", label: "Username", type: "text", value: "admin" },
                        { name: "password", label: "Senha", type: "text", value: "admin123" }
                    ],
                    onSuccess: (data) => { if (data.token) applySession(data); }
                }
            ]
        },
        {
            title: "Gigs",
            items: [
                { id: "gigs-list", method: "GET", path: "/gigs", label: "Listar freelas", desc: "Rota pública — não precisa de login.", auth: "none", fields: [] },
                { id: "gigs-get", method: "GET", path: "/gigs/{id}", label: "Detalhe de um freela", desc: "Rota pública.", auth: "none",
                    fields: [ { name: "id", label: "ID do freela", type: "text", value: "1", inPath: true } ] },
                { id: "gigs-create", method: "POST", path: "/gigs", label: "Criar freela", desc: "Precisa estar logado. O dono é quem está logado.", auth: "required",
                    fields: [
                        { name: "title", label: "Título", type: "text", value: "Editar vídeo para trabalho" },
                        { name: "description", label: "Descrição", type: "textarea", value: "Preciso editar 5 minutos de vídeo com cortes e legenda." },
                        { name: "category", label: "Categoria", type: "text", value: "Audiovisual" },
                        { name: "price", label: "Preço", type: "text", value: "90.00" }
                    ] },
                { id: "gigs-update", method: "PUT", path: "/gigs/{id}", label: "Editar freela", desc: "Só o dono ou admin.", auth: "required",
                    fields: [
                        { name: "id", label: "ID do freela", type: "text", value: "1", inPath: true },
                        { name: "title", label: "Título", type: "text", value: "Criar logo (atualizado)" },
                        { name: "description", label: "Descrição", type: "textarea", value: "Preciso de um logo simples e moderno para o TCC." },
                        { name: "category", label: "Categoria", type: "text", value: "Design" },
                        { name: "price", label: "Preço", type: "text", value: "100.00" }
                    ] },
                { id: "gigs-close", method: "PATCH", path: "/gigs/{id}/close", label: "Encerrar freela", desc: "Só o dono ou admin.", auth: "required",
                    fields: [ { name: "id", label: "ID do freela", type: "text", value: "1", inPath: true } ] },
                { id: "gigs-delete", method: "DELETE", path: "/gigs/{id}", label: "Apagar freela", desc: "Só o dono ou admin.", auth: "required",
                    fields: [ { name: "id", label: "ID do freela", type: "text", value: "1", inPath: true } ] }
            ]
        },
        {
            title: "Candidaturas",
            items: [
                { id: "apps-apply", method: "POST", path: "/gigs/{gigId}/applications", label: "Se candidatar", desc: "Precisa estar logado; não pode ser o dono do freela.", auth: "required",
                    fields: [
                        { name: "gigId", label: "ID do freela", type: "text", value: "2", inPath: true },
                        { name: "message", label: "Mensagem", type: "textarea", value: "Tenho experiência e posso entregar até sexta." }
                    ] },
                { id: "apps-by-gig", method: "GET", path: "/gigs/{gigId}/applications", label: "Ver candidaturas de um freela", desc: "Só o dono do freela ou admin.", auth: "required",
                    fields: [ { name: "gigId", label: "ID do freela", type: "text", value: "2", inPath: true } ] },
                { id: "apps-mine", method: "GET", path: "/applications/me", label: "Minhas candidaturas", desc: "Qualquer autenticado.", auth: "required", fields: [] },
                { id: "apps-status", method: "PATCH", path: "/applications/{id}/status", label: "Aceitar / rejeitar", desc: "Só o dono do freela ou admin.", auth: "required",
                    fields: [
                        { name: "id", label: "ID da candidatura", type: "text", value: "1", inPath: true },
                        { name: "status", label: "Status", type: "select", options: ["ACCEPTED", "REJECTED"], value: "ACCEPTED" }
                    ] },
                { id: "apps-withdraw", method: "DELETE", path: "/applications/{id}", label: "Retirar candidatura", desc: "O próprio candidato (se PENDING) ou admin.", auth: "required",
                    fields: [ { name: "id", label: "ID da candidatura", type: "text", value: "1", inPath: true } ] }
            ]
        },
        {
            title: "Usuários",
            items: [
                { id: "users-me", method: "GET", path: "/users/me", label: "Meu perfil", desc: "Qualquer autenticado. Mostra também cep/cidade/uf.", auth: "required", fields: [] },
                { id: "users-address", method: "PATCH", path: "/users/me/address", label: "Atualizar CEP", desc: "Consulta o CEP via HttpExchange (ViaCEP) e atualiza cidade/UF do usuário logado.", auth: "required",
                    fields: [ { name: "cep", label: "CEP", type: "text", value: "01310930" } ] },
                { id: "users-list", method: "GET", path: "/users", label: "Listar usuários", desc: "Somente admin.", auth: "required", fields: [] },
                { id: "users-delete", method: "DELETE", path: "/users/{id}", label: "Remover usuário", desc: "Somente admin.", auth: "required",
                    fields: [ { name: "id", label: "ID do usuário", type: "text", value: "3", inPath: true } ] }
            ]
        }
    ];

    function applySession(data) {
        state.token = data.token;
        state.username = data.username;
        state.role = data.role;
        renderSession();
    }

    function clearSession() {
        state.token = null;
        state.username = null;
        state.role = null;
        renderSession();
    }

    function renderSession() {
        const who = document.getElementById("whoLabel");
        const badge = document.getElementById("roleBadge");
        if (state.token) {
            who.innerHTML = `logado como <b>${state.username}</b>`;
            badge.textContent = state.role;
            badge.className = "badge role-" + state.role;
        } else {
            who.textContent = "não logado";
            badge.textContent = "—";
            badge.className = "badge none";
        }
    }

    document.getElementById("logoutBtn").addEventListener("click", clearSession);

    function buildRail() {
        const rail = document.getElementById("rail");
        rail.innerHTML = "";
        groups.forEach(group => {
            const title = document.createElement("div");
            title.className = "group-title";
            title.textContent = group.title;
            rail.appendChild(title);

            group.items.forEach(item => {
                const el = document.createElement("div");
                el.className = "req-item";
                el.dataset.id = item.id;
                el.innerHTML = `
        <span class="method ${item.method}">${item.method}</span>
        <span class="req-label">${item.label}</span>
        ${item.auth === "required" ? '<span class="req-lock">🔒</span>' : ""}
      `;
                el.addEventListener("click", () => selectItem(item, el));
                rail.appendChild(el);
            });
        });
    }

    function selectItem(item, el) {
        document.querySelectorAll(".req-item").forEach(n => n.classList.remove("active"));
        el.classList.add("active");
        renderMain(item);
    }

    function renderMain(item) {
        const main = document.getElementById("main");

        const authNote = item.auth === "required"
            ? (state.token
                ? `<span class="auth-note ok">🔓 usa o token de <b>${state.username}</b> automaticamente</span>`
                : `<span class="auth-note missing">⚠️ faça login primeiro — esta rota exige autenticação</span>`)
            : `<span class="auth-note">rota pública, sem token</span>`;

        const fieldsHtml = item.fields.map(f => {
            if (f.type === "textarea") {
                return `<div class="field"><label>${f.label}</label><textarea data-field="${f.name}">${f.value || ""}</textarea></div>`;
            }
            if (f.type === "select") {
                const opts = f.options.map(o => `<option value="${o}" ${o === f.value ? "selected" : ""}>${o}</option>`).join("");
                return `<div class="field"><label>${f.label}</label><select data-field="${f.name}">${opts}</select></div>`;
            }
            return `<div class="field"><label>${f.label}</label><input type="text" data-field="${f.name}" value="${f.value || ""}" /></div>`;
        }).join("");

        main.innerHTML = `
    <div class="req-header">
      <h2 class="req-title">${item.label}</h2>
      <div class="req-desc">${item.desc}</div>
      <div class="req-path"><span class="method ${item.method}" style="width:auto;padding:2px 8px;">${item.method}</span> ${item.path}</div>
    </div>
    <div class="form-grid">${fieldsHtml}</div>
    <div class="actions">
      <button class="btn-send" id="sendBtn">Enviar</button>
      ${authNote}
    </div>
    <div class="response" id="responseBox" style="display:none;">
      <div class="response-header">
        <span class="response-title">Resposta</span>
        <span class="status-pill" id="statusPill"></span>
      </div>
      <pre class="body" id="responseBody"></pre>
    </div>
  `;

        document.getElementById("sendBtn").addEventListener("click", () => sendRequest(item));
    }

    async function sendRequest(item) {
        const btn = document.getElementById("sendBtn");
        btn.disabled = true;
        btn.textContent = "Enviando...";

        const baseUrl = document.getElementById("baseUrl").value.replace(/\/$/, "");
        const values = {};
        document.querySelectorAll("[data-field]").forEach(el => {
            values[el.dataset.field] = el.value;
        });

        let path = item.path;
        const bodyObj = {};
        item.fields.forEach(f => {
            if (f.inPath) {
                path = path.replace(`{${f.name}}`, encodeURIComponent(values[f.name]));
            } else {
                bodyObj[f.name] = f.name === "price" ? Number(values[f.name]) : values[f.name];
            }
        });

        const headers = { "Content-Type": "application/json" };
        if (item.auth === "required" && state.token) {
            headers["Authorization"] = "Bearer " + state.token;
        }

        const hasBody = item.fields.some(f => !f.inPath);

        const options = { method: item.method, headers };
        if (hasBody && item.method !== "GET" && item.method !== "DELETE") {
            options.body = JSON.stringify(bodyObj);
        } else if (hasBody && item.method === "DELETE") {
            // (não usamos DELETE com body neste projeto, mas deixamos preparado)
        }

        const box = document.getElementById("responseBox");
        const pill = document.getElementById("statusPill");
        const bodyEl = document.getElementById("responseBody");
        box.style.display = "block";

        try {
            const res = await fetch(baseUrl + path, options);
            let text = await res.text();
            let parsed;
            try { parsed = JSON.parse(text); } catch { parsed = text; }

            pill.textContent = res.status + " " + res.statusText;
            pill.className = "status-pill " + (res.status < 300 ? "status-2xx" : res.status < 500 ? "status-4xx" : "status-5xx");
            bodyEl.textContent = typeof parsed === "string" ? parsed : JSON.stringify(parsed, null, 2);

            if (res.ok && item.onSuccess) item.onSuccess(parsed);
        } catch (err) {
            pill.textContent = "Erro de rede";
            pill.className = "status-pill status-err";
            bodyEl.textContent = String(err) + "\n\nConfira se a aplicação Spring Boot está rodando e se o CORS/Base URL estão certos.";
        } finally {
            btn.disabled = false;
            btn.textContent = "Enviar";
        }
    }

    buildRail();
    renderSession();
</script>

</body>
</html>
